services:
  app:
    environment:
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
      GREETING: "${GREETING:-Hello, Docker!}"
    build: .
    ports:
      - "${APP_PORT:-8081}:8000"
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 42
volumes:
  redis_data:

